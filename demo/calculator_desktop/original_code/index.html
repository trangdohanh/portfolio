<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Original version</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <link href="style.css" rel="stylesheet" type="text/css" />

  <script src="https://hammerjs.github.io/dist/hammer.js"></script>
</head>

<body onload="loadSaved()">
  <!--Shopping Page-->
  <section id="shopping" class="tabContent">
    <!--Choose Province and Currency-->
    <header>
      <div class="province">
        <label>Province</label>
        <select onchange="updateProvince()" id="dropProvince">
          <option value=" " hidden>– Select Province –</option>
          <option value="five">Alberta</option>
          <option value="twelve">British Columbia</option>
          <option value="twelve">Manitoba</option>
          <option value="fifteen">New Brunswick</option>
          <option value="fifteen">Newfoundland and Labrador</option>
          <option value="five">Northwest Territories</option>
          <option value="fifteen">Nova Scotia</option>
          <option value="five">Nunavut</option>
          <option value="thirteen">Ontario</option>
          <option value="fifteen">Prince Edward Island</option>   
          <option value="fifteen">Quebec</option> 
          <option value="eleven">Saskatchewan</option> 
          <option value="five">Yukon</option> 
        </select>
      </div>
     
      <div class="currency">
        <label>Currency</label>

        <select id="dropCurrency">
          <option value=" " hidden>– Select Currency –</option>
        </select>
      </div>
      
    </header>
  
    <!--Shopping List-->
    <section id="shop">
      <div id="list">
        <div id="listFood">
          <h3>Food & Beverage</h3>
          <h4 id="fCAD"></h4>
          <h4 id="fExch"></h4>
          <div id="addFood"></div>
        </div>
  
        <div id="listHealth">
          <h3>Health & Beauty</h3>
          <h4 id="hCAD"></h4>
          <h4 id="hExch"></h4>
          <div id="addHealth"></div>
        </div>
  
        <div id="listClothes">
          <h3>Clothing, Footwear, & Accessories</h3>
          <h4 id="cCAD"></h4>
          <h4 id="cExch"></h4>
          <div id="addClothes"></div>
        </div>
  
        <div id="listHouse">
          <h3>Household Item</h3>
          <h4 id="iCAD"></h4>
          <h4 id="iExch"></h4>
          <div id="addHouse"></div>
        </div>
  
        <div id="listOther">
          <h3>Other</h3>
          <h4 id="oCAD"></h4>
          <h4 id="oExch"></h4>
          <div id="addOther"></div>
        </div>
        
      </div>
  
      <button onclick="openForm()" class="popup">Add To Your List</button>
      
      <div class="input-popup" id="myInput">
        <h2>Add To Your List</h2>
          
        <button onclick="closeForm()" class="close">Close</button>
        
        <form>
          <div class="category-input">
            <select id="dropCategory">
              <option value=" " hidden>- Select Category -</option>
              <option value="food">Food & Beverage</option>
              <option value="health">Health & Beauty</option>
              <option value="clothes">Clothing, Footwear, & Accessories</option>
              <option value="house">Household Item</option>
              <option value="other">Other</option>
            </select>
          </div>
          
          <div class="product-input">
            <label>Product</label>
            <br><input id="product" type="text" placeholder="..." oninput="previewInput()">
          </div>
  
            <div class="price-input">
              <label>Price</label>
              <br><input id="price" type="text" placeholder="CA$" oninput="previewInput()">
            </div>
  
            <div class="quantity-input">
              <label>Quantity</label>
              <br><input id="quantity" type="number" min="1" value="1" oninput="previewInput()">
            </div>
  
            <p id="conversion">For nothing, you have to pay 0 CAD, which is 0</p>
  
            <br><input class="add-input" type="button" onclick="checkForm()" value="ADD">
          
            <input class="reset-input" type="reset" value="RESET" onclick="clearInput()">
        </form>
      </div>
  
      <div id="summary">
        <span class="swipeUp"></span>
        <div class="total">
          <h3>Total Amount</h3>
          <div id="totalCAD">0.00 CAD</div>
          <div id="totalExch">0</div>
        </div>
        <div class="subtotal">
          <h3>Subtotal</h3>
          <div id="subCAD">0.00 CAD</div>
          <div id="subExch">0</div>
        </div>
        <div class="tax">
          <h3>Tax
            <span id="taxRate"></span>
          </h3>
          <div id="taxCAD">0.00 CAD</div>
          <div id="taxExch">0</div>
        </div>
        <button class="save" onclick="save()">SAVE</button>
        <button class="new" onclick="location.reload(true)">NEW</button>
      </div>
    </section>
  </section>

  <!--Catalog Page-->
  <section id="catalog" class="tabContent">
    <h2>Your Saved Trips</h2>
    <div id="savedList">
      <div id="addTrip"></div>
    </div>
  </section>


  <!--Tabs-->
  <footer>
    <button onclick="openPage(event, 'shopping')" id="defaultOpen" class="tabLink">
      <img src="../image/cart.svg"/>
    </button>
    <button onclick="openPage(event, 'catalog')" id="open" class="tabLink"><img src="../image/list.svg"/></button>
  </footer>
  <script src="script.js"></script>
</body>

</html>
